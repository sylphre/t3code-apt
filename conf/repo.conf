# Repository-wide settings, sourced by the scripts in scripts/.
# Edit BASE_URL after the archive host is known.

ORIGIN="T3 Code APT Archive"
LABEL="T3 Code"
SUITE="stable"
CODENAME="stable"
COMPONENT="main"
ARCHES="amd64 arm64"
DESCRIPTION="APT archive for the T3 Code desktop app"
MAINTAINER="Laurier Sylph <laurier@sylph.re>"
COPYRIGHT="(C) 2014-2026 Laurier Sylph. All rights reserved."

# Public base URL of the published archive, used by the install snippet.
BASE_URL="https://example.invalid/t3code"

UPSTREAM_REPO="pingdotgg/t3code"
UPSTREAM_CHANNEL="stable"

# Signing key. The secret part lives in secrets/gnupg (git-ignored).
KEY_NAME="T3 Code APT Archive"
KEY_EMAIL="laurier@sylph.re"
KEY_UID="${KEY_NAME} <${KEY_EMAIL}>"
GNUPGHOME="${ROOT}/secrets/gnupg"
